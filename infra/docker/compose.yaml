services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_local_only
      POSTGRES_DB: astra
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - astra-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  astra-postgres:
