name: Bug report
description: Report a reproducible non-security defect
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, payment information, or security exploits.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS / Linux, Node version, browser
